      "verify_subcmd": "--version",
      "why": "Schema install/upgrade for the MySQL and Postgres SKUs. The SQLite SKU we ship does not need it at boot (see db.note), but it is the documented migration path for an operator moving off SQLite, so it belongs in the image."
